[project]
name = "steeltrack-lstm"
version = "0.1.0"
description = "SteelTrack LSTM Demand Forecasting Service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "prometheus-client>=0.20",
    "python-json-logger>=2.0",
    "apscheduler>=3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]
gpu = [
    "torch>=2.5",
]

[project.scripts]
lstm-api = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
