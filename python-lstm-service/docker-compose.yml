services:
  postgres:
    image: postgres:16-alpine
    container_name: steeltrack-lstm-db
    environment:
      POSTGRES_DB: SteelTrackDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SteelTrackDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  lstm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steeltrack-lstm-api
    ports:
      - "8001:8000"
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:12345@postgres:5432/SteelTrackDb
      MODEL_DIR: /app/models
      LSTM_API_KEY: ${LSTM_API_KEY:-dev-api-key-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LSTM_ENABLE_SCHEDULER: ${LSTM_ENABLE_SCHEDULER:-true}
    volumes:
      - ./models:/app/models
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
