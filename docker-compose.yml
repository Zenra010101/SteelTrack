services:
  postgres:
    image: postgres:16-alpine
    container_name: steeltrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SteelTrackDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-SteelTrackDb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - steeltrack-net

  steeltrack-lstm:
    build:
      context: .
      dockerfile: Dockerfile.lstm
    container_name: steeltrack-lstm
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password_2026}@postgres:5432/${POSTGRES_DB:-SteelTrackDb}
      MODEL_DIR: /app/models
      LSTM_API_KEY: ${LSTM_API_KEY:-st_live_lstm_dAnBjPTeD6YZCoQdm5UX5RpZVDBqRSRLrctKzG8z-bQ}
      LSTM_LOOKBACK_MONTHS: ${LSTM_LOOKBACK_MONTHS:-24}
      LSTM_HORIZON_MONTHS: ${LSTM_HORIZON_MONTHS:-3}
      LSTM_MIN_HISTORY_MONTHS: ${LSTM_MIN_HISTORY_MONTHS:-2}
      LSTM_METRICS_PORT: 9090
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LSTM_ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - lstm_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - steeltrack-net

  steeltrack-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steeltrack-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=${POSTGRES_DB:-SteelTrackDb};User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_password_2026};Ssl Mode=Prefer;Trust Server Certificate=true;
      ConnectionStrings__PostgreSQLConnection: Server=postgres;Port=5432;Database=${POSTGRES_DB:-SteelTrackDb};User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_password_2026};Ssl Mode=Prefer;Trust Server Certificate=true;
      Jwt__Secret: ${JWT_SECRET:-SteelTrack_Enterprise_Super_Secret_Key_2026_Secure_JWT_Key_XYZ123!}
      Jwt__Issuer: SteelTrack
      Jwt__Audience: SteelTrack
      Jwt__ExpirationHours: 12
      Lstm__BaseUrl: http://steeltrack-lstm:8000
      Lstm__ApiKey: ${LSTM_API_KEY:-st_live_lstm_dAnBjPTeD6YZCoQdm5UX5RpZVDBqRSRLrctKzG8z-bQ}
      Lstm__LookbackMonths: 24
      Lstm__HorizonMonths: 3
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      steeltrack-lstm:
        condition: service_healthy
    networks:
      - steeltrack-net

  vite-preview:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steeltrack-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api.steeltrackerp.com}
    ports:
      - "5173:5173"
    depends_on:
      - steeltrack-api
    networks:
      - steeltrack-net

  caddy:
    image: caddy:2-alpine
    container_name: steeltrack-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vite-preview
      - steeltrack-api
    networks:
      - steeltrack-net

volumes:
  postgres_data:
  lstm_models:
  caddy_data:
  caddy_config:

networks:
  steeltrack-net:
    driver: bridge

